<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>YuFan 🐾</title>
  <meta name="description" content="畫畫・貓咪・資訊" />

  <meta property="og:title" content="YuFan 🐾" />
  <meta property="og:description" content="畫畫・貓咪・資訊 🐱🎨💻" />
  <meta property="og:image" content="https://wuuyf.github.io/images/avatar.jpg" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       VOICE  : 可愛、溫暖
       IDEA   : 一張黃白格紋野餐布上的小名片
       PICTURE: 小熊頭像＋三張像貼紙的連結卡片
       COLOUR : 奶油黃格紋、杏橘、深咖啡
       TYPE   : Huninn（粉圓）
       LAYOUT : 手機優先的單欄，電腦上維持手機寬度置中
       ===================================================== */
    :root {
      --cream: #FFF9E4;
      --ging: rgba(247, 220, 126, .33);
      --card: #FFFDF5;
      --apricot: #F6C987;
      --brown: #5C3D24;
      --brown-soft: #8B6A4E;
      --sunflower: #F2B33D;
    }
    *, *::before, *::after { box-sizing: border-box; min-width: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh;
      font: 16px/1.6 "Huninn", "PingFang TC", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
      color: var(--brown);
      background-color: var(--cream);
      background-image:
        linear-gradient(90deg, var(--ging) 50%, transparent 50%),
        linear-gradient(var(--ging) 50%, transparent 50%);
      background-size: 56px 56px;
      background-attachment: fixed;
      overflow-x: clip;
    }
    main {
      max-width: 480px; margin: 0 auto;
      padding: calc(76px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
      text-align: center;
    }

    /* ---------- 頭像與名稱 ---------- */
    .avatar {
      position: relative; display: inline-block;
      width: 128px; height: 128px;
      animation: pop .6s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      border-radius: 50%;
      border: 4px solid var(--card);
      box-shadow: 0 0 0 3px var(--brown), 0 6px 0 3px var(--brown);
    }
    .avatar .flower {
      position: absolute; right: -6px; bottom: 4px;
      font-size: 1.7rem; line-height: 1;
      animation: sway 3s ease-in-out infinite;
    }
    h1 { margin: 22px 0 4px; font-size: 1.9rem; font-weight: 400; letter-spacing: .02em; }
    .tagline { margin: 0; font-size: 1.05rem; }

    /* ---------- 連結卡片 ---------- */
    .links { display: grid; gap: 16px; margin: 32px 0 0; padding: 0; list-style: none; }
    .links li { animation: rise .5s ease-out both; }
    .links li:nth-child(1) { animation-delay: .15s; }
    .links li:nth-child(2) { animation-delay: .25s; }
    .links li:nth-child(3) { animation-delay: .35s; }
    .links li:nth-child(4) { animation-delay: .45s; }
    .links li:nth-child(5) { animation-delay: .55s; }

    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 84px; padding: 12px 18px 12px 12px;
      background: var(--card);
      border: 3px solid var(--brown); border-radius: 24px;
      box-shadow: 0 5px 0 var(--brown);
      color: inherit; text-decoration: none; text-align: left;
      transition: transform .15s, box-shadow .15s, background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover { background: #FFF3D2; transform: translateY(-2px); box-shadow: 0 7px 0 var(--brown); }
    .link:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brown); }
    .link:focus-visible { outline: 3px solid var(--sunflower); outline-offset: 4px; }

    .thumb {
      flex: none; width: 58px; height: 58px;
      border-radius: 16px; overflow: hidden;
      border: 2px solid var(--brown);
      display: grid; place-items: center;
      background: var(--apricot);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb svg { width: 32px; height: 32px; fill: var(--brown); }
    .text { flex: 1; }
    .title { display: block; font-size: 1.2rem; line-height: 1.35; }
    .desc { display: block; font-size: .92rem; line-height: 1.45; color: var(--brown-soft); }
    .arrow { flex: none; font-size: 1.3rem; color: var(--brown-soft); transition: transform .15s; }
    .link:hover .arrow { transform: translateX(3px); }

    /* ---------- 語言切換 ---------- */
    .lang {
      position: fixed; z-index: 10;
      top: calc(12px + env(safe-area-inset-top)); right: 12px;
      display: flex; padding: 3px;
      background: var(--card); border: 2.5px solid var(--brown); border-radius: 999px;
      box-shadow: 0 3px 0 var(--brown);
    }
    .lang button {
      min-width: 40px; min-height: 34px; padding: 0 10px;
      border: 0; border-radius: 999px; background: transparent;
      font: inherit; font-size: .9rem; color: var(--brown-soft); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .lang button[aria-pressed="true"] { background: var(--apricot); color: var(--brown); }
    .lang button:focus-visible { outline: 3px solid var(--sunflower); outline-offset: 1px; }

    footer { margin-top: 40px; font-size: .85rem; color: var(--brown-soft); }

    @keyframes pop { from { opacity: 0; transform: scale(.6); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh-Hant">中</button>
    <button type="button" data-lang="ja">日</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <main>
    <div class="avatar">
      <img src="images/avatar.jpg" alt="YuFan" width="128" height="128" />
      <span class="flower" aria-hidden="true">🌻</span>
    </div>
    <h1>YuFan</h1>
    <p class="tagline" data-i18n="tagline">畫畫・貓咪・資訊 🐱🎨💻</p>

    <!--
      ✏️ 新增連結：複製一整段 <li>…</li>，改掉 href、圖片、標題和說明就好
      縮圖放在 images/ 資料夾，正方形、約 240px 就夠
    -->
    <ul class="links">
      <li>
        <a class="link" href="https://github.com/wuuyf" target="_blank" rel="noopener">
          <span class="thumb"><img src="images/github.jpg" alt="" /></span>
          <span class="text">
            <span class="title">GitHub</span>
            <span class="desc" data-i18n="ghDesc">程式與研究</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </li>

      <li>
        <a class="link" href="https://wuuyf.github.io/pudding-strawberry/" target="_blank" rel="noopener">
          <span class="thumb"><img src="images/cats.jpg" alt="" /></span>
          <span class="text">
            <span class="title" data-i18n="catTitle">🐾 布丁 & 草莓</span>
            <span class="desc" data-i18n="catDesc">我家貓咪介紹</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </li>

      <li>
        <a class="link" href="https://wuuyf.github.io/Art-Journey/" target="_blank" rel="noopener">
          <span class="thumb"><img src="images/nengajo.jpg" alt="" /></span>
          <span class="text">
            <span class="title" data-i18n="nengaTitle">⛩️ 年賀狀</span>
            <span class="desc" data-i18n="nengaDesc">每年元旦的手繪賀卡</span>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </li>
    </ul>

    <footer>© YuFan</footer>
  </main>
  <script>
    /* =====================================================
       三種語言的文案：要改字就改這裡
       ===================================================== */
    const TEXT = {
      "zh-Hant": {
        tagline: "畫畫・貓咪・資訊 🐱🎨💻",
        ghDesc: "程式與研究",
        catTitle: "🐾 布丁 & 草莓",
        catDesc: "我家貓咪介紹",
        nengaTitle: "⛩️ 年賀狀",
        nengaDesc: "每年元旦的手繪賀卡",
      },
      ja: {
        tagline: "イラスト・猫・プログラミング 🐱🎨💻",
        ghDesc: "コードと研究",
        catTitle: "🐾 プリン & いちご",
        catDesc: "うちの猫たちの紹介",
        nengaTitle: "⛩️ 年賀状",
        nengaDesc: "毎年お正月に描いている年賀状",
      },
      en: {
        tagline: "Drawing・Cats・Code 🐱🎨💻",
        ghDesc: "Code & research",
        catTitle: "🐾 Pudding & Strawberry",
        catDesc: "Meet my cats",
        nengaTitle: "⛩️ Nengajo",
        nengaDesc: "My hand-drawn New Year cards",
      },
    };

    {
      const store = {
        get(k) { try { return localStorage.getItem(k); } catch { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch { /* 忽略 */ } },
      };
      const buttons = document.querySelectorAll(".lang button");

      function applyLang(lang) {
        const t = TEXT[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t[el.dataset.i18n];
        });
        buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
        store.set("links-lang", lang);
      }

      // 先用上次選的語言；沒有的話，看瀏覽器語言
      const nav = (navigator.language || "").toLowerCase();
      const guess = nav.startsWith("ja") ? "ja" : nav.startsWith("zh") ? "zh-Hant" : "en";
      const saved = store.get("links-lang");
      applyLang(TEXT[saved] ? saved : guess);

      buttons.forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));
    }
  </script>
</body>
</html>
